  - Gartenpflege

services:
  id: leistungen
  eyebrow: 01 / LEISTUNGEN
  title:
    - WAS ANSTEHT.
    - WIRD ANGEPACKT.
  intro: Drei Leistungsbereiche für private Haushalte, Hausverwaltungen, Gewerbe und öffentliche Einrichtungen.
  request_label: Diese Leistung anfragen
  items:
    - number: "01 /"
      title: Wohnungsauflösung / Entrümpelung
      text: Einfamilienhäuser, Wohnungen, Keller, Dachboden, Garagen, Büro- und Gewerbeflächen, auch Messie-Wohnungen sowie Sperrmüllentsorgungen aller Art.
      request: Entrümpelung / Wohnungsauflösung
      icon: /service-clearance-line.png
    - number: "02 /"
      title: Warentransport
      text: Warentransport bis 1,2 Tonnen pro Fahrt bis 200 Kilometer im Umkreis von Cottbus, auch Umzüge.
      request: Warentransport
      icon: /service-transport-line.png
    - number: "03 /"
      title: Gartenpflege
      text: Grün- und Gartenpflege, Zuschnitt, Rasenmähen, Lieferung von Gartenbedarf sowie Entsorgung.
      request: Gartenpflege
      icon: /service-garden-line.png

area:
  id: gebiet
  eyebrow: 02 / EINSATZGEBIET
  title:
    - HIER ZU HAUSE.
  title_accent: |-
    FÜR SIE
    UNTERWEGS.
  text: Um diese Achse herum erstreckt sich mein Einsatzgebiet. In Forst bei Cottbus ansässig fahre ich über Südbrandenburg bis nach Berlin und über Nordsachsen bis nach Dresden. Egal ob Eisenhüttenstadt, Bad Saarow oder Spremberg, hier bin ich zu Hause, hier möchte ich was bewegen.
  image: /l4u-van-garden.jpg
  image_aria: Der L4U Transporter steht auf einer Wiese vor Bäumen.
  regions:
    - label: Berlin.
    - label: Cottbus.
    - label: Dresden.

about:
  id: ueber
  eyebrow: 03 / EINER FÜR DIE SCHWEREN SACHEN
  title:
    - Ohne Umweg.
    - Ein Ansprechpartner.
  more: Ohne Umwege direkt zum Ziel, gerne auch mit Sonderwünschen. Ich bin flexibel und kann gut anpacken und übe meine Tätigkeit mit Leidenschaft und Ehrlichkeit aus, die Zufriedenheit meiner Kunden steht an oberster Stelle. Bei mir sind Sie richtig, wenn es darum geht, Lösungen zu finden, um weiterzukommen.

