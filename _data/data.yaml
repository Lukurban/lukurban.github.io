hero:
  kicker_left: Einer für die schweren Sachen, verlässlich und effizient.
  kicker_right: Berlin – Cottbus – Dresden
  title:
    - Keller voll?
    - Mieter weg?
    - Zuviel des Grünen?
  text: L4U ist Ihr direkter Ansprechpartner, wenn es darum geht, zuverlässig, schnell und zielorientiert Ihre Projekte umzusetzen und Aufgaben zu lösen.
  cta: LOS GEHT’S
  image: /l4u-hero-lukas-van.jpg

