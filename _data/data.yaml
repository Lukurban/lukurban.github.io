  datenschutz:
    eyebrow: HINWEIS
    title: Datenschutz
    paragraphs:
      - Diese Website lädt keine externen Schriften, Bilder, Analyse- oder Kartendienste. Die Formularangaben werden ausschließlich zum Versand Ihrer Anfrage genutzt und auf dieser Website nicht dauerhaft gespeichert.
      - Beim Absenden wird in Ihrem eigenen E-Mail-Programm eine vorbereitete E-Mail an die Adresse des Betreibers erstellt; den Versand lösen Sie selbst aus und sehen vorher alle Angaben. Die Daten werden dabei nicht an Dritte übermittelt und auf dieser Website nicht gespeichert. Der Anfragetext kann zusätzlich in die Zwischenablage kopiert oder als lokale Datei gespeichert werden.
      - Externe MyHammer-Links verlassen diese Website.
      - Eine vollständige Datenschutzerklärung wird ergänzt, sobald Hosting und Kontaktwege final feststehen.

