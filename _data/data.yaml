about:
  id: ueber
  mark_left: TRANSPORT & GARTEN
  mark_right: LAUSITZ
  eyebrow: 03 / DER MENSCH DAHINTER
  title:
    - KEIN UMWEG.
    - EIN ANSPRECHPARTNER.
  text: Ich bin Lukas Urbanek. Ich bin flexibel, packe gern an und stehe für einen ehrlichen Umgang. Für Ihr Vorhaben suche ich eine praktische Lösung – und bei Bedarf kombiniere ich mehrere Leistungen miteinander.
  sign: LUKAS URBANEK / L4U

faq:
  id: fragen
  eyebrow: HÄUFIGE FRAGEN
  title: KLARE ANTWORTEN.
  items:
    - question: Welche Orte gehören zum Einsatzgebiet?
      answer: L4U ist rund um Cottbus im Einsatz, mit Fahrten bis zu 100 Kilometern. Größere Aufträge sind auch in Berlin oder Dresden möglich. Den konkreten Einsatzort bitte in der Anfrage nennen.
    - question: Kann ich mehrere Leistungen kombinieren?
      answer: Ja. Entrümpelung, Transport und Gartenpflege lassen sich nach Bedarf miteinander verbinden. Beschreiben Sie alle anstehenden Aufgaben, damit eine passende Paketlösung besprochen werden kann.
    - question: Was kostet mein Auftrag?
      answer: Für diesen Entwurf sind keine Preise hinterlegt. Umfang, Anfahrt und Aufwand müssen für ein konkretes Angebot geklärt werden. Eine kurze Beschreibung Ihres Vorhabens ist dafür der erste Schritt.

